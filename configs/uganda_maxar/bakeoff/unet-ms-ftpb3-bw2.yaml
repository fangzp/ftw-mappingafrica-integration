# Uganda bakeoff UNet arm: MS 2 m, BGRN single window, 3-class, FTP-B3 init (taylor-geospatial/ftp-b3, CC-BY-NC-4.0),
# first conv collapsed 8 -> 4 by summing the two window halves.
# Boundary widened to 2 px per instance (4 m), chip edge not boundary: unet_3class_bw/multispectral.
# Fixed schedule; report last.ckpt. Validation runs on the test split (monitoring only).
# Input /10000 (min_max over [0, 10000]): the scale ftp-b3 was trained on.

trainer:
  max_epochs: 100
  log_every_n_steps: 10
  accelerator: cuda
  default_root_dir: /nfs/hpc/share/fangzha/outputs/uganda_bakeoff/unet_ms_ftpb3_bw2
  devices: [0]
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: null
        save_top_k: 1
        save_last: true
        filename: '{epoch}'
model:
  class_path: ftw_ma.trainers.CustomSemanticSegmentationTask
  init_args:
    loss: localtversky
    model: unet
    backbone: efficientnet-b3
    weights: /nfs/hpc/share/fangzha/weights/ftp-b3/model.safetensors
    patch_weights: false
    in_channels: 4
    num_classes: 3
    ignore_index: 3
    lr: 1e-3
    patience: 100  # CosineAnnealingLR T_max in epochs; equals max_epochs
data:
  class_path: ftw_ma.datamodule.FTWMapAfricaDataModule
  init_args:
    temporal_options: windowA
    batch_size: 16
    num_workers: 8
    num_samples: -1
    random_resized_crop: false
    data_dir: /nfs/hpc/share/fangzha/data/uganda_coco_20261014_derived/unet_3class_bw/multispectral
    catalog: /nfs/hpc/share/fangzha/data/uganda_coco_20261014_derived/unet_3class_bw/multispectral/uganda-maxar-catalog.csv
    normalization_strategy: min_max
    normalization_stat_procedure: gpb
    global_stats:
      min: [0, 0, 0, 0]
      max: [10000, 10000, 10000, 10000]
    img_clip_val: 0
    nodata: [0]
    nodata_all_bands: true
    nodata_mask_value: 3
seed_everything: 42
