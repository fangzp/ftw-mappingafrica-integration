# Uganda Maxar UNet: BGRN single-window, 3-class (background / interior / boundary), crop 501x501.
# Regional-only; do not add to ALL_COUNTRIES. Use catalog + data_dir pointing to Option B layout.
# Normalization: band-wise mean/std from Uganda train set (match ag-seg Mask2Former Uganda config).

trainer:
  max_epochs: 100
  log_every_n_steps: 10
  accelerator: cuda
  default_root_dir: /nfs/hpc/share/fangzha/outputs/uganda-maxar-unet
  devices: [0]
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: '{epoch}-{val_loss:.2f}'
model:
  class_path: ftw_ma.trainers.CustomSemanticSegmentationTask
  init_args:
    class_weights: [0.05, 0.2, 0.75]
    loss: localtversky
    model: unet
    backbone: efficientnet-b3
    weights: true
    patch_weights: false
    in_channels: 4
    num_classes: 3
    ignore_index: 3
    lr: 1e-3
    patience: 100
data:
  class_path: ftw_ma.datamodule.FTWMapAfricaDataModule
  init_args:
    temporal_options: windowA
    batch_size: 16
    num_workers: 0
    num_samples: -1
    crop_size: [501, 501]
    data_dir: /nfs/hpc/share/fangzha/data/uganda_maxar_unet
    catalog: /nfs/hpc/share/fangzha/data/uganda_maxar_unet/uganda-maxar-catalog.csv
    normalization_strategy: z_value
    normalization_stat_procedure: gpb
    global_stats:
      mean: [2160.112107499254, 2720.384320220083, 2156.533516309466, 4174.567795159017]
      std: [1499.029369788556, 1508.715890626181, 1408.9864076781628, 1532.448615017464]
    img_clip_val: 0
seed_everything: 42
